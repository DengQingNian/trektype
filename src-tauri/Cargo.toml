[package]
name = "typetrek"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
edition = "2021"
default-run = "typetrek"
# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "typetrek_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# 桌面框架：tray-icon 特性提供常驻托盘（合规要求不可隐藏）
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# 本地存储：bundled-sqlcipher 内置 SQLCipher（加密 SQLite），vendored-openssl 自带
# OpenSSL 源码编译（免系统依赖）。WAL 等 PRAGMA 见 src/db/mod.rs，加密开关见 src/db/crypto.rs
rusqlite = { version = "0.40.2", features = ["bundled-sqlcipher-vendored-openssl"] }
# 数据库加密密钥存储：写进 Windows 凭据管理器（不落磁盘明文）
keyring = { version = "3", features = ["windows-native"] }
# 时间处理：本地时区日期切分（聚合表按 YYYY-MM-DD 分组）与 JSON 序列化
chrono = { version = "0.4.45", features = ["serde"] }
# 事件队列：钩子回调 try_send 非阻塞入队（见 src/capture/mod.rs）
crossbeam-channel = "0.5.17"
# Win32 绑定：键盘/鼠标低级钩子、前台窗口、显示器枚举、进程名解析
windows = { version = "0.62.2", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_UI_Input_KeyboardAndMouse", "Win32_System_Threading", "Win32_Graphics_Gdi", "Win32_UI_HiDpi"] }
# 单实例：第二次启动时聚焦已有窗口（避免双份采集）
tauri-plugin-single-instance = "2.4.5"
# 开机自启（默认关，设置页开启）
tauri-plugin-autostart = "2.5.1"
# 全局快捷键：暂停/恢复（默认 Ctrl+Alt+P）
tauri-plugin-global-shortcut = "2.3.2"
# 导出文件的系统保存对话框（Rust 侧调用）
tauri-plugin-dialog = "2.7.3"
# 窗口隐藏到托盘时的首次气泡提示
tauri-plugin-notification = "2.4.0"


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
